[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-kick"
version = "0.1.0"
description = "Crawlora Kick API client with 21 endpoints for channels, livestreams, clips, categories, search, and public mobile-app catalogues"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "kick", "kick-api", "kick-scraper", "kick-data", "kick-channels", "kick-livestreams", "kick-clips", "kick-categories", "kick-search"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=kick-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=kick-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-kick"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_kick"]

[tool.setuptools.package-data]
"crawlora_kick" = ["py.typed", "*.pyi"]
